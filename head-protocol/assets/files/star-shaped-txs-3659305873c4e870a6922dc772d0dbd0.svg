<svg xmlns="http://www.w3.org/2000/svg" width="560" height="706" viewBox="0 0 560 706" role="img" aria-labelledby="title description">
  <title id="title">Independent funding and settlement</title>
  <desc id="description">Head A, between Alice and the service, and Head B, between Bob and the service, open and receive deposits independently on Cardano. They use distinct inputs, UTxO sets, and snapshots. Each validates and signs its own L2 transactions and can close, contest, and fan out independently.</desc>
  <!-- Maintained directly as SVG; see docs/README.md for the shared diagram style. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#527b76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .heading { font-size: 20px; font-weight: 600; fill: #194d46; }
      .step { font-size: 18px; font-weight: 600; fill: #194d46; }
      .body { font-size: 16px; fill: #415955; }
      .label { font-size: 15px; fill: #526761; }
      .detail { font-size: 14px; fill: #526761; }
      .message { font-size: 16px; fill: #415955; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .path { fill: none; stroke: #527b76; stroke-width: 1.8; marker-end: url(#arrow); }
      .line { fill: none; stroke: #527b76; stroke-width: 1.8; }
      .guide { fill: none; stroke: #b5d0c9; stroke-width: 1.2; stroke-dasharray: 5 6; }
      .card { fill: #f0f7f5; stroke: #b5d0c9; stroke-width: 1.2; }
      .group { fill: #fff; stroke: #b5d0c9; stroke-width: 1.2; }
      .accent { fill: #e0eee9; stroke: #8fb8ac; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="560" height="706" rx="12" fill="#fff"/>
  <path d="M 88 80 V 606" class="guide"/>
  <rect x="16.0" y="16" width="144" height="64" rx="12" class="card"/>
  <text x="88.0" y="43.5" text-anchor="middle" class="step">Head A</text>
  <text x="88.0" y="69.5" text-anchor="middle" class="detail">Alice + service</text>
  <path d="M 280 80 V 606" class="guide"/>
  <rect x="208.0" y="16" width="144" height="64" rx="12" class="card"/>
  <text x="280.0" y="54.0" text-anchor="middle" class="step">Cardano L1</text>
  <path d="M 472 80 V 606" class="guide"/>
  <rect x="400.0" y="16" width="144" height="64" rx="12" class="card"/>
  <text x="472.0" y="43.5" text-anchor="middle" class="step">Head B</text>
  <text x="472.0" y="69.5" text-anchor="middle" class="detail">Bob + service</text>
  <rect x="140" y="102" width="280" height="32" fill="#fff"/>
  <text x="280" y="125" text-anchor="middle" class="step">Open and fund independently</text>
  <path d="M 280 198 H 88" class="path"/>
  <text x="184.0" y="165" text-anchor="middle" class="message">Init, then deposit</text>
  <text x="184.0" y="186" text-anchor="middle" class="message">and increment</text>
  <path d="M 280 264 H 472" class="path"/>
  <text x="376.0" y="231" text-anchor="middle" class="message">Init, then deposit</text>
  <text x="376.0" y="252" text-anchor="middle" class="message">and increment</text>
  <rect x="24" y="300" width="512" height="52" rx="12" class="card"/>
  <text x="280" y="331.0" text-anchor="middle" class="body">Separate inputs, UTxO sets, and snapshots.</text>
  <rect x="16" y="384" width="144" height="84" rx="12" class="card"/>
  <text x="88.0" y="411.0" text-anchor="middle" class="step">Transact on L2</text>
  <text x="88.0" y="437.0" text-anchor="middle" class="detail">Validate txs</text>
  <text x="88.0" y="458.0" text-anchor="middle" class="detail">Sign snapshots</text>
  <rect x="400" y="384" width="144" height="84" rx="12" class="card"/>
  <text x="472.0" y="411.0" text-anchor="middle" class="step">Transact on L2</text>
  <text x="472.0" y="437.0" text-anchor="middle" class="detail">Validate txs</text>
  <text x="472.0" y="458.0" text-anchor="middle" class="detail">Sign snapshots</text>
  <path d="M 88 534 H 280" class="path"/>
  <text x="184.0" y="501" text-anchor="middle" class="message">Close, contest,</text>
  <text x="184.0" y="522" text-anchor="middle" class="message">and fan out</text>
  <path d="M 472 600 H 280" class="path"/>
  <text x="376.0" y="567" text-anchor="middle" class="message">Close, contest,</text>
  <text x="376.0" y="588" text-anchor="middle" class="message">and fan out</text>
  <rect x="24" y="636" width="512" height="52" rx="12" class="card"/>
  <text x="280" y="667.0" text-anchor="middle" class="body">Each head settles independently.</text>
</svg>
