<svg xmlns="http://www.w3.org/2000/svg" width="560" height="902" viewBox="0 0 560 902" role="img" aria-labelledby="title description">
  <title id="title">A Hydra head alongside Cardano</title>
  <desc id="description">Init opens an empty head on L1. Deposits and increments make funds spendable in the head. Parties validate L2 transactions and sign snapshots. Decommits and decrements can return outputs to L1 while the head stays open. Close publishes a confirmed snapshot. After the contestation deadline, fanout distributes outputs over one or more L1 transactions and burns the head tokens.</desc>
  <!-- Maintained directly as SVG; see docs/README.md for the shared diagram style. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#527b76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .heading { font-size: 20px; font-weight: 600; fill: #194d46; }
      .step { font-size: 18px; font-weight: 600; fill: #194d46; }
      .body { font-size: 16px; fill: #415955; }
      .label { font-size: 15px; fill: #526761; }
      .detail { font-size: 14px; fill: #526761; }
      .message { font-size: 16px; fill: #415955; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .path { fill: none; stroke: #527b76; stroke-width: 1.8; marker-end: url(#arrow); }
      .line { fill: none; stroke: #527b76; stroke-width: 1.8; }
      .guide { fill: none; stroke: #b5d0c9; stroke-width: 1.2; stroke-dasharray: 5 6; }
      .card { fill: #f0f7f5; stroke: #b5d0c9; stroke-width: 1.2; }
      .group { fill: #fff; stroke: #b5d0c9; stroke-width: 1.2; }
      .accent { fill: #e0eee9; stroke: #8fb8ac; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="560" height="902" rx="12" fill="#fff"/>
  <path d="M 104 80 V 810" class="guide"/>
  <rect x="16.0" y="16" width="176" height="64" rx="12" class="card"/>
  <text x="104.0" y="54.0" text-anchor="middle" class="step">Cardano L1</text>
  <path d="M 456 80 V 568" class="guide"/>
  <rect x="368.0" y="16" width="176" height="64" rx="12" class="card"/>
  <text x="456.0" y="54.0" text-anchor="middle" class="step">Hydra head</text>
  <path d="M 104 130 H 456" class="path"/>
  <text x="280.0" y="118" text-anchor="middle" class="message">Init opens an empty head</text>
  <path d="M 104 198 H 456" class="path"/>
  <text x="280.0" y="186" text-anchor="middle" class="message">Deposit, then increment</text>
  <rect x="320" y="238" width="216" height="96" rx="12" class="card"/>
  <text x="428.0" y="271.0" text-anchor="middle" class="step">Transact on L2</text>
  <text x="428.0" y="297.0" text-anchor="middle" class="detail">Validate transactions</text>
  <text x="428.0" y="318.0" text-anchor="middle" class="detail">All parties sign snapshots</text>
  <path d="M 456 398 H 104" class="path"/>
  <text x="280.0" y="365" text-anchor="middle" class="message">Decommit, then decrement</text>
  <text x="280.0" y="386" text-anchor="middle" class="message">Optional, while open</text>
  <rect x="320" y="434" width="216" height="64" rx="12" class="card"/>
  <text x="428.0" y="461.5" text-anchor="middle" class="step">Continue transacting</text>
  <text x="428.0" y="487.5" text-anchor="middle" class="body">Head stays open</text>
  <path d="M 456 554 H 104" class="path"/>
  <text x="280.0" y="542" text-anchor="middle" class="message">Close with a confirmed snapshot</text>
  <rect x="24" y="588" width="192" height="64" rx="12" class="card"/>
  <text x="120.0" y="615.5" text-anchor="middle" class="step">Contestation period</text>
  <text x="120.0" y="641.5" text-anchor="middle" class="body">Contest if needed</text>
  <path d="M 104 652 V 710" class="path"/>
  <text x="118" y="688" text-anchor="start" class="message">After the deadline</text>
  <rect x="24" y="716" width="192" height="86" rx="12" class="card"/>
  <text x="120.0" y="744.0" text-anchor="middle" class="heading">Fan out</text>
  <text x="120.0" y="770.0" text-anchor="middle" class="body">One or more</text>
  <text x="120.0" y="791.0" text-anchor="middle" class="body">L1 transactions</text>
  <rect x="24" y="834" width="512" height="52" rx="12" class="card"/>
  <text x="280" y="865.0" text-anchor="middle" class="body">Outputs return to L1; head tokens are burned.</text>
</svg>
