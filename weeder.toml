roots = [
  "^Main.main$",
  "^Paths_.*",
  # hydra-agda/generated is MAlonzo output (see hydra-agda/regenerate.sh). The extractor emits
  # every definition of every module it touches, so most are unreachable by construction; which
  # ones is the extractor's business, not ours. The hand-written shims in hydra-agda/src are
  # still weeded.
  "^MAlonzo\\.",
  "traceDebug$",
  "spy$",
  "spy'$",
  "alwaysFailingScript$",
  "dummyValidatorScriptAlwaysFails$",
  "exampleValidator$",
  "exampleSecureValidatorScript$",
  "propTransactionFailsEvaluation$",
]

root-instances = [
  # Stock instances are treated as roots.
  { class = '\.Eq$' },
  { class = '\.Show$' },
  { class = '\.Read$' },
  { class = '\.Enum$' },
  { class = '\.Bounded$' },
  { class = '\.Generic$' },
  { class = '\.Ord$' },
  { class = '\.Num$' },
  { class = '\.Real$' },
  { class = '\.Integral$' },
  { class = '\.IsString$' },
  # unstableMakeIsData creates all Data instances at once, some are unused and
  # so are treated as roots.
  { module = "Hydra.Contract.Commit", instance = "UnsafeFromData Commit" },
  { module = "Hydra.Contract.Deposit", instance = "FromData DepositRedeemer" },
  { module = "Hydra.Contract.MintAction", instance = "FromData MintAction" },
  { module = "Hydra.Contract.Dummy", instance = "FromData R" },
  { module = "Hydra.Contract.Dummy", instance = "ToData R" },
  # Load-bearing: the placebo To/FromJSON and To/FromCBOR instances on Payment
  # are forced superclasses of IsTx; Hydra.Model does not compile without them.
  { module = "Hydra.Model.Payment", instance = "IsTx" },
  { module = "Hydra.Model", instance = "HasVariables" },
  # These are used for debugging.
  { module = "Hydra.Chain.Direct.TxTraceSpec", instance = "HasVariables" },
  { module = "Hydra.Chain.Direct.TxTraceSpec", instance = "MonadFail AppM" },
  { module = "Hydra.Chain.Direct.TxTraceSpec", instance = "MonadThrow AppM" },
  # Client-side decode counterpart of the CBOR-encoded GET /config response.
  # Not covered by a roundtrip property: non-integral JSON numbers round-trip
  # through Double (cborg-json) and lose precision.
  { module = "Hydra.CBOR.Orphans", instance = "FromCBOR Value" },
  # Orphan instances needed by hydra-explorer
  { module = "Hydra.Cardano.Api.NetworkId", instance = "Arbitrary NetworkId" },
  { module = "Hydra.Cardano.Api.NetworkMagic", instance = "Arbitrary NetworkMagic" },
  # test instances
  { module = "Test.Hydra.Tx.Gen", instance = "Arbitrary HydraAccumulator" },
  # Forbid-constrained instances are intentionally unreachable: their purpose
  # is to emit a GHC TypeError if anyone tries to derive or call them.
  { module = "Hydra.Tx.Crypto", instance = 'FromJSON \(SigningKey HydraKey\)' },
  { module = "Hydra.Tx.Crypto", instance = 'FromCBOR \(SigningKey HydraKey\)' },
  { module = "Hydra.Tx.Secret", instance = 'FromJSON \(Secret a\)' },
  { module = "Hydra.Tx.Secret", instance = 'FromCBOR \(Secret a\)' },
]
