<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Transact together</title>
<desc id="desc">Parties validate transactions and sign snapshots without an L1 transaction for each payment.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#527b76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="600" height="400" rx="12" fill="#f0f7f5"/>
<text x="300" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#194d46" font-weight="600">Transact together</text>
<circle cx="180" cy="140" r="27" fill="#527b76"/>
<text x="180" y="147" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="white" font-weight="600">A</text>
<circle cx="420" cy="140" r="27" fill="#527b76"/>
<text x="420" y="147" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="white" font-weight="600">B</text>
<circle cx="300" cy="280" r="27" fill="#527b76"/>
<text x="300" y="287" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="white" font-weight="600">C</text>
<path d="M210,140 L388,140" fill="none" stroke="#527b76" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M405,167 L320,255" fill="none" stroke="#527b76" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M278,257 L195,168" fill="none" stroke="#527b76" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="213" y="185" width="174" height="46" rx="12" fill="#FFFFFF" stroke="#b5d0c9" stroke-width="1.2"/>
<text x="300.0" y="215.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#415955" font-weight="normal">Signed snapshot</text>
<text x="300" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#415955" font-weight="normal">All parties validate and sign</text>
</svg>
