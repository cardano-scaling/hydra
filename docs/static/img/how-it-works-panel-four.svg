<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Settle on Cardano</title>
<desc id="desc">Close, allow time to contest, then distribute outputs in one or more fanout transactions.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#527b76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="600" height="400" rx="12" fill="#f0f7f5"/>
<text x="300" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#194d46" font-weight="600">Settle on Cardano</text>
<rect x="40" y="135" width="150" height="65" rx="12" fill="#FFFFFF" stroke="#b5d0c9" stroke-width="1.2"/>
<text x="115.0" y="174.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#415955" font-weight="normal">Closed head</text>
<path d="M195,168 L300,168" fill="none" stroke="#527b76" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="310" y="115" width="240" height="48" rx="12" fill="#FFFFFF" stroke="#b5d0c9" stroke-width="1.2"/>
<text x="430.0" y="146.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#415955" font-weight="normal">Output to Alice</text>
<rect x="310" y="180" width="240" height="48" rx="12" fill="#FFFFFF" stroke="#b5d0c9" stroke-width="1.2"/>
<text x="430.0" y="211.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#415955" font-weight="normal">Output to Bob</text>
<rect x="310" y="245" width="240" height="48" rx="12" fill="#FFFFFF" stroke="#b5d0c9" stroke-width="1.2"/>
<text x="430.0" y="276.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#415955" font-weight="normal">Further outputs</text>
<text x="160" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#415955" font-weight="normal">After contestation</text>
<text x="300" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#415955" font-weight="normal">Fanout can take several transactions</text>
</svg>
