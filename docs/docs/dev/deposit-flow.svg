<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1010" viewBox="0 0 640 1010" role="img" aria-labelledby="title description">
  <title id="title">Deposit flow</title>
  <desc id="description">Successful deposit flow with Node A leading the snapshot. POST /commit returns a draft, which the client signs and submits. Once the deposit is active, the leader broadcasts ReqSn with its transaction ID. Each party resolves the deposited UTxO, validates the request, and broadcasts AckSn. Collecting all signatures confirms the snapshot and approves the commit. Any participant can submit the increment; observing it finalizes the commit and makes the deposited outputs spendable on L2. Named client events are WebSocket notifications.</desc>
  <!-- Maintained directly as SVG; see docs/README.md for the shared diagram style. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#527b76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .step { font-size: 18px; font-weight: 600; fill: #194d46; }
      .body { font-size: 16px; fill: #415955; }
      .label { font-size: 14px; fill: #526761; }
      .message { font-size: 16px; fill: #415955; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .path { fill: none; stroke: #527b76; stroke-width: 1.8; marker-end: url(#arrow); }
      .response { stroke-dasharray: 6 4; }
      .guide { fill: none; stroke: #b5d0c9; stroke-width: 1.2; stroke-dasharray: 5 6; }
      .card { fill: #f0f7f5; stroke: #b5d0c9; stroke-width: 1.2; }
      .accent { fill: #e0eee9; stroke: #8fb8ac; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="640" height="1010" rx="12" fill="#fff"/>
  <path d="M 80 64 V 982" class="guide"/>
  <g>
    <rect x="16" y="16" width="128" height="48" rx="10" class="card"/>
  <text x="80.0" y="46.0" text-anchor="middle" class="step">Client</text>
  </g>
  <path d="M 240 64 V 982" class="guide"/>
  <g>
    <rect x="176" y="16" width="128" height="48" rx="10" class="card"/>
  <text x="240.0" y="46.0" text-anchor="middle" class="step">Node A</text>
  </g>
  <path d="M 400 64 V 982" class="guide"/>
  <g>
    <rect x="336" y="16" width="128" height="48" rx="10" class="card"/>
  <text x="400.0" y="46.0" text-anchor="middle" class="step">Other nodes</text>
  </g>
  <path d="M 560 64 V 982" class="guide"/>
  <g>
    <rect x="496" y="16" width="128" height="48" rx="10" class="card"/>
  <text x="560.0" y="46.0" text-anchor="middle" class="step">Cardano L1</text>
  </g>
  <path d="M 80 112 H 240" class="path"/>
  <text x="160.0" y="100" text-anchor="middle" class="message">POST /commit</text>
  <path d="M 240 162 H 80" class="path response"/>
  <text x="160.0" y="150" text-anchor="middle" class="message">HTTP 200: draft</text>
  <path d="M 80 212 H 560" class="path"/>
  <text x="320.0" y="200" text-anchor="middle" class="message">Sign and submit depositTx</text>
  <path d="M 560 262 H 240" class="path response"/>
  <text x="400.0" y="250" text-anchor="middle" class="message">Observe depositTx</text>
  <path d="M 240 312 H 80" class="path response"/>
  <text x="160.0" y="300" text-anchor="middle" class="message">CommitRecorded</text>
  <g>
    <rect x="176" y="338" width="288" height="64" rx="10" class="card"/>
  <text x="320.0" y="365.0" text-anchor="middle" class="body">Wait for activation</text>
  <text x="320.0" y="387.0" text-anchor="middle" class="body">within the selection window</text>
  </g>
  <path d="M 240 442 H 80" class="path response"/>
  <text x="160.0" y="430" text-anchor="middle" class="message">DepositActivated</text>
  <path d="M 240 492 H 400" class="path"/>
  <text x="320.0" y="480" text-anchor="middle" class="message">ReqSn (depositTxId)</text>
  <g>
    <rect x="176" y="516" width="288" height="70" rx="10" class="card"/>
  <text x="320.0" y="546.0" text-anchor="middle" class="body">Each node validates the deposit</text>
  <text x="320.0" y="568.0" text-anchor="middle" class="body">and signs the snapshot</text>
  </g>
  <path d="M 240 622 H 400" class="path"/>
  <text x="320.0" y="610" text-anchor="middle" class="message">AckSn</text>
  <path d="M 400 670 H 240" class="path"/>
  <text x="320.0" y="658" text-anchor="middle" class="message">AckSn</text>
  <path d="M 240 720 H 80" class="path response"/>
  <text x="160.0" y="708" text-anchor="middle" class="message">SnapshotConfirmed</text>
  <path d="M 240 768 H 80" class="path response"/>
  <text x="160.0" y="756" text-anchor="middle" class="message">CommitApproved</text>
  <path d="M 240 818 H 560" class="path"/>
  <text x="400.0" y="806" text-anchor="middle" class="message">Submit incrementTx</text>
  <path d="M 560 868 H 240" class="path response"/>
  <text x="400.0" y="856" text-anchor="middle" class="message">Observe incrementTx</text>
  <path d="M 240 918 H 80" class="path response"/>
  <text x="160.0" y="906" text-anchor="middle" class="message">CommitFinalized</text>
  <g>
    <rect x="16" y="944" width="608" height="50" rx="10" class="accent"/>
  <text x="320.0" y="975.0" text-anchor="middle" class="body">Deposited outputs are now spendable on L2.</text>
  </g>
</svg>
