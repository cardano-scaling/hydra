<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1068" viewBox="0 0 560 1068" role="img" aria-labelledby="title description">
  <title id="title">Hydra node components</title>
  <desc id="description">Clients use the API. Head logic coordinates persistence, networking, ledger validation, chain interaction, logging, and monitoring. Networking connects to other Hydra nodes. Chain and fuel wallet use Cardano access and Hydra contracts. The Cardano ledger uses rust-accumulator for commitments and proofs.</desc>
  <!-- Maintained directly as SVG; see docs/README.md for the shared diagram style. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#527b76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .heading { font-size: 20px; font-weight: 600; fill: #194d46; }
      .step { font-size: 18px; font-weight: 600; fill: #194d46; }
      .body { font-size: 16px; fill: #415955; }
      .label { font-size: 15px; fill: #526761; }
      .detail { font-size: 14px; fill: #526761; }
      .message { font-size: 16px; fill: #415955; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .path { fill: none; stroke: #527b76; stroke-width: 1.8; marker-end: url(#arrow); }
      .line { fill: none; stroke: #527b76; stroke-width: 1.8; }
      .guide { fill: none; stroke: #b5d0c9; stroke-width: 1.2; stroke-dasharray: 5 6; }
      .card { fill: #f0f7f5; stroke: #b5d0c9; stroke-width: 1.2; }
      .group { fill: #fff; stroke: #b5d0c9; stroke-width: 1.2; }
      .accent { fill: #e0eee9; stroke: #8fb8ac; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="560" height="1068" rx="12" fill="#fff"/>

  <!-- Internal components, grouped around Head logic. -->
  <rect x="16" y="112" width="528" height="490" rx="12" class="group"/>
  <text x="36" y="137" text-anchor="start" class="step">hydra-node</text>
  <rect x="160" y="16" width="240" height="64" rx="12" class="card"/>
  <text x="280.0" y="43.5" text-anchor="middle" class="heading">Client</text>
  <text x="280.0" y="69.5" text-anchor="middle" class="body">Wallet, TUI, or application</text>
  <path d="M 280 86 V 158" class="path" marker-start="url(#arrow)"/>
  <rect x="176" y="164" width="208" height="76" rx="12" class="card"/>
  <text x="280" y="187" text-anchor="middle" class="heading">API</text>
  <text x="280" y="211" text-anchor="middle" class="detail">HTTP / WebSocket</text>
  <text x="280" y="231" text-anchor="middle" class="detail">JSON / CBOR</text>
  <path d="M 280 240 V 266" class="path"/>
  <rect x="176" y="272" width="208" height="76" rx="12" class="card"/>
  <text x="280.0" y="305.5" text-anchor="middle" class="heading">Head logic</text>
  <text x="280.0" y="331.5" text-anchor="middle" class="detail">Events and signed snapshots</text>
  <path d="M 280 348 V 366 H 108 V 392" class="path"/>
  <path d="M 280 366 V 392" class="path"/>
  <path d="M 280 366 H 452 V 392" class="path"/>
  <rect x="32" y="398" width="152" height="80" rx="12" class="card"/>
  <text x="108.0" y="423.0" text-anchor="middle" class="step">Persistence</text>
  <text x="108.0" y="449.0" text-anchor="middle" class="detail">SQLite: hydra.db</text>
  <text x="108.0" y="470.0" text-anchor="middle" class="detail">CBOR events</text>
  <rect x="204" y="398" width="152" height="80" rx="12" class="card"/>
  <text x="280.0" y="423.0" text-anchor="middle" class="step">Networking</text>
  <text x="280.0" y="449.0" text-anchor="middle" class="detail">Auth + etcd</text>
  <text x="280.0" y="470.0" text-anchor="middle" class="detail">Outbound queue</text>
  <rect x="376" y="398" width="152" height="80" rx="12" class="card"/>
  <text x="452.0" y="433.5" text-anchor="middle" class="step">Cardano ledger</text>
  <text x="452.0" y="459.5" text-anchor="middle" class="detail">L2 validation</text>
  <path d="M 176 310 H 24 V 548 H 42" class="path"/>
  <path d="M 384 310 H 536 V 548 H 518" class="path"/>
  <rect x="48" y="512" width="224" height="72" rx="12" class="card"/>
  <text x="160" y="543.5" text-anchor="middle" class="step">Chain + fuel wallet</text>
  <text x="160" y="569.5" text-anchor="middle" class="body">Build and observe L1 txs</text>
  <rect x="288" y="512" width="224" height="72" rx="12" class="card"/>
  <text x="400" y="543.5" text-anchor="middle" class="step">Logging + monitoring</text>
  <text x="400" y="569.5" text-anchor="middle" class="body">JSON logs · Prometheus</text>

  <!-- External dependencies are shown separately to keep connectors short. -->
  <text x="32" y="648" text-anchor="start" class="heading">External connections</text>
  <rect x="32" y="676" width="184" height="72" rx="12" class="card"/>
  <text x="124.0" y="718.0" text-anchor="middle" class="step">Networking</text>
  <path d="M 222 712 H 266" class="path" marker-start="url(#arrow)"/>
  <rect x="272" y="676" width="256" height="72" rx="12" class="card"/>
  <text x="400.0" y="718.0" text-anchor="middle" class="step">Other Hydra nodes</text>
  <rect x="32" y="816" width="184" height="88" rx="12" class="card"/>
  <text x="124" y="866" text-anchor="middle" class="step">Chain + fuel wallet</text>
  <path d="M 222 850 H 244 V 816 H 266" class="path" marker-start="url(#arrow)"/>
  <path d="M 216 874 H 236 V 904 H 266" class="path"/>
  <rect x="272" y="784" width="256" height="64" rx="12" class="card"/>
  <text x="400" y="811" text-anchor="middle" class="heading">Cardano access</text>
  <text x="400" y="837" text-anchor="middle" class="body">Socket / Blockfrost</text>
  <rect x="272" y="872" width="256" height="64" rx="12" class="card"/>
  <text x="400" y="899" text-anchor="middle" class="heading">Hydra contracts</text>
  <text x="400" y="925" text-anchor="middle" class="detail">PlutusTx + Aiken · KZG / CRS</text>
  <rect x="32" y="968" width="184" height="76" rx="12" class="card"/>
  <text x="124" y="1012" text-anchor="middle" class="step">Cardano ledger</text>
  <path d="M 222 1006 H 266" class="path"/>
  <rect x="272" y="968" width="256" height="76" rx="12" class="card"/>
  <text x="400" y="1001.5" text-anchor="middle" class="step">rust-accumulator</text>
  <text x="400" y="1027.5" text-anchor="middle" class="body">Commitments and proofs</text>
</svg>
