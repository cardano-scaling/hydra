<svg xmlns="http://www.w3.org/2000/svg" width="560" height="748" viewBox="0 0 560 748" role="img" aria-labelledby="title description">
  <title id="title">Deposit transaction structure</title>
  <desc id="description">A dApp input is spent with its witness in a deposit transaction. Output zero locks the deposited value and records the target Head ID, deadline, and L2 outputs. Optional change stays on L1 under the dApp spending rules. A signed increment claims the deposit before its deadline, or recovery reproduces the recorded outputs after the deadline. The dApp must check the head, outputs, value, and timing.</desc>
  <!-- Maintained directly as SVG; see docs/README.md for the shared diagram style. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#527b76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .heading { font-size: 20px; font-weight: 600; fill: #194d46; }
      .step { font-size: 18px; font-weight: 600; fill: #194d46; }
      .body { font-size: 16px; fill: #415955; }
      .label { font-size: 15px; fill: #526761; }
      .detail { font-size: 14px; fill: #526761; }
      .message { font-size: 16px; fill: #415955; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .path { fill: none; stroke: #527b76; stroke-width: 1.8; marker-end: url(#arrow); }
      .line { fill: none; stroke: #527b76; stroke-width: 1.8; }
      .guide { fill: none; stroke: #b5d0c9; stroke-width: 1.2; stroke-dasharray: 5 6; }
      .card { fill: #f0f7f5; stroke: #b5d0c9; stroke-width: 1.2; }
      .group { fill: #fff; stroke: #b5d0c9; stroke-width: 1.2; }
      .accent { fill: #e0eee9; stroke: #8fb8ac; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="560" height="748" rx="12" fill="#fff"/>
  <rect x="120" y="16" width="320" height="76" rx="12" class="card"/>
  <text x="280.0" y="49.5" text-anchor="middle" class="heading">dApp input</text>
  <text x="280.0" y="75.5" text-anchor="middle" class="body">Assets and application datum</text>
  <path d="M 280 92 V 142" class="path"/>
  <text x="294" y="124" text-anchor="start" class="label">Spend with witness</text>
  <rect x="120" y="148" width="320" height="64" rx="12" class="card"/>
  <text x="280.0" y="186.0" text-anchor="middle" class="heading">Deposit transaction</text>
  <path d="M 280 212 V 246 H 164 V 282" class="path"/>
  <path d="M 280 246 H 432 V 282" class="path"/>
  <rect x="24" y="288" width="280" height="112" rx="12" class="card"/>
  <text x="164.0" y="318.5" text-anchor="middle" class="heading">Output 0: deposit script</text>
  <text x="164.0" y="344.5" text-anchor="middle" class="detail">Value matches recorded outputs</text>
  <text x="164.0" y="365.5" text-anchor="middle" class="detail">Head ID and deadline</text>
  <text x="164.0" y="386.5" text-anchor="middle" class="detail">Recorded L2 outputs</text>
  <rect x="328" y="288" width="208" height="112" rx="12" class="card"/>
  <text x="432.0" y="329.0" text-anchor="middle" class="step">Optional L1 change</text>
  <text x="432.0" y="355.0" text-anchor="middle" class="body">Subject to the</text>
  <text x="432.0" y="376.0" text-anchor="middle" class="body">dApp spending rules</text>
  <path d="M 164 400 V 440 H 148 V 474" class="path"/>
  <path d="M 164 440 H 412 V 474" class="path"/>
  <rect x="24" y="480" width="248" height="164" rx="12" class="card"/>
  <text x="148.0" y="526.0" text-anchor="middle" class="heading">Claim</text>
  <text x="148.0" y="552.0" text-anchor="middle" class="body">Before the deadline</text>
  <text x="148.0" y="573.0" text-anchor="middle" class="body">Signed increment targets</text>
  <text x="148.0" y="594.0" text-anchor="middle" class="body">this deposit and head</text>
  <text x="148.0" y="615.0" text-anchor="middle" class="body">Spend on L2 once settled</text>
  <rect x="288" y="480" width="248" height="164" rx="12" class="card"/>
  <text x="412.0" y="526.0" text-anchor="middle" class="heading">Recover n</text>
  <text x="412.0" y="552.0" text-anchor="middle" class="body">After the deadline</text>
  <text x="412.0" y="573.0" text-anchor="middle" class="body">Reproduce the first n</text>
  <text x="412.0" y="594.0" text-anchor="middle" class="body">recorded outputs</text>
  <text x="412.0" y="615.0" text-anchor="middle" class="body">One deposit per transaction</text>
  <rect x="24" y="668" width="512" height="64" rx="12" class="card"/>
  <text x="280" y="694.5" text-anchor="middle" class="body">Check head, outputs, value, and timing.</text>
  <text x="280" y="715.5" text-anchor="middle" class="body">The script address alone is insufficient.</text>
</svg>
