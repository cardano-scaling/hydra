# Build distributable executables.
name: Binaries

on:
  push:
    branches:
    - master
    - release
    tags:
    - "*.*.*"
  # Allows to trigger runs on any branch
  workflow_dispatch:

jobs:
  build-windows:
    name: Cross-build Windows binaries on Linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: ./.github/actions/nix-cachix-setup
      with:
        authToken: '${{ secrets.CACHIX_CARDANO_SCALING_AUTH_TOKEN }}'
    - name: Build Windows ZIP and native script reference
      run: |
        nix build .#release-windows --out-link windows-release
    - uses: actions/upload-artifact@v4
      with:
        name: hydra-windows-candidate
        path: windows-release/*

  test-windows:
    name: Test Windows binaries
    needs: build-windows
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        name: hydra-windows-candidate
        path: candidate
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Extract and exercise the release
      shell: pwsh
      run: |
        Expand-Archive candidate/hydra-x86_64-windows.zip 'release with spaces'
        python scripts/smoke-test-binary.py 'release with spaces/hydra-node.exe' candidate/linux-script-catalogue.json
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $version = git describe --always HEAD
        "VERSION=$version" >> $env:GITHUB_ENV
    - name: Upload tested executables
      uses: actions/upload-artifact@v4
      with:
        name: hydra-x86_64-windows-${{ env.VERSION }}
        path: release with spaces/*
    - name: Upload runtime logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-smoke-logs
        path: binary smoke test/*.log

  build-linux:
    name: "Build for ${{ matrix.os.name }}"
    runs-on: ${{ matrix.os.name }}
    strategy:
      matrix:
        os:
          - name: ubuntu-latest
            arch: x86_64-linux
          - name: ubuntu-24.04-arm
            arch: aarch64-linux
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        # Also ensure we have all history with all tags
        fetch-depth: 0

    - name: ❄ Setup Nix/Cachix
      uses: ./.github/actions/nix-cachix-setup
      with:
        authToken: '${{ secrets.CACHIX_CARDANO_SCALING_AUTH_TOKEN }}'

    - name: 🕵 Determine version
      run: |
        # NOTE: For some reason the fetched tags on checkout are not effective
        # and we need to refetch with --force for git describe.
        git fetch --tags --force
        echo "VERSION=$(git describe --always HEAD)" | tee "$GITHUB_ENV"

    - name: ❄ Build executables on ${{ matrix.os.name }}
      # Produces static ELF binary for using MuslC which includes all needed
      # libraries statically linked into it.
      run: |
        # XXX: aarch64-linux can't build static binaries yet.
        # See: https://github.com/cardano-scaling/hydra/issues/2370
        if [[ "${{ matrix.os.name }}" == "ubuntu-latest" ]]; then
          nix build .#release-static
        else
          nix build .#release
        fi

        # XXX: Why unzip https://github.com/actions/upload-artifact/issues/39
        unzip result/*.zip -d out

    - name: 💾 Upload executables
      uses: actions/upload-artifact@v4
      with:
        name: hydra-${{ matrix.os.arch }}-${{ env.VERSION }} # automatically zips
        path: out/*

  build-macos:
    name: "Build for aarch64-darwin"
    runs-on: macos-latest
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        # Also ensure we have all history with all tags
        fetch-depth: 0

    - name: ❄ Setup Nix/Cachix
      uses: ./.github/actions/nix-cachix-setup
      with:
        authToken: '${{ secrets.CACHIX_CARDANO_SCALING_AUTH_TOKEN }}'

    - name: 🕵 Determine version
      run: |
        # NOTE: For some reason the fetched tags on checkout are not effective
        # and we need to refetch with --force for git describe.
        git fetch --tags --force
        echo "VERSION=$(git describe --always HEAD)" | tee "$GITHUB_ENV"

    - name: ❄ Build executables
      # Produces a dynamic Mach-O binary which is still dynamically linked against
      # system dependencies, but all third-party libraries are statically linked.
      run: |
        nix build .#release
        # XXX: Why unzip https://github.com/actions/upload-artifact/issues/39
        unzip result/*.zip -d out

    - name: 💾 Upload executables
      uses: actions/upload-artifact@v4
      with:
        name: hydra-aarch64-darwin-${{ env.VERSION }} # automatically zips
        path: out/*
