name: "Publish Docs"
run-name: Publish Docs (${{ github.event.release.tag_name || inputs.version || 'unstable' }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published stable release tag to retry (for example, 2.4.2)'
        required: true
        type: string
  release:
    types: [published]
  # The receiving workflow must exist on master. Pin the build to the
  # successful upstream run's commit, rather than checking out a moving branch.
  workflow_run:
    workflows: ["CI"]
    branches: ["master"]
    types:
      - completed

permissions:
  contents: read

jobs:
  source:
    name: Select documentation version
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) ||
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
    - name: Resolve exact source commit
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        CI_SHA: ${{ github.event.workflow_run.head_sha }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        REQUESTED_VERSION: ${{ inputs.version }}
      run: |
        if [[ "$EVENT_NAME" == workflow_run ]]; then
          echo "version=unstable" >> "$GITHUB_OUTPUT"
          echo "sha=$CI_SHA" >> "$GITHUB_OUTPUT"
          echo "Building unstable docs from successful CI commit \`$CI_SHA\`." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        version=${RELEASE_TAG:-$REQUESTED_VERSION}
        if [[ ! $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "::error::Expected a stable release tag such as 2.4.2"
          exit 1
        fi
        published=$(gh api "repos/$GH_REPO/releases/tags/$version" \
          --jq 'select(.draft == false and .prerelease == false) | .tag_name')
        if [[ "$published" != "$version" ]]; then
          echo "::error::$version must be a published stable GitHub release"
          exit 1
        fi
        latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
        if [[ "$version" != "$latest" ]]; then
          echo "Skipping $version: the current stable release is $latest." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        sha=$(gh api "repos/$GH_REPO/commits/refs/tags/$version" --jq .sha)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "Building docs for \`$version\` from tagged commit \`$sha\`." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Documentation
    needs: source
    if: needs.source.outputs.sha != ''
    runs-on: ubuntu-latest
    env:
      DOCS_VERSION: ${{ needs.source.outputs.version }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:

    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ env.SOURCE_SHA }}
        fetch-depth: 0

    - name: ❄ Setup Nix/Cachix
      uses: ./.github/actions/nix-cachix-setup
      with:
        authToken: '${{ secrets.CACHIX_CARDANO_SCALING_AUTH_TOKEN }}'

    - name: Build documentation and compute benchmarks
      run: |

        # Release
        DERIVATION=docs
        OUT_PATH=

        [[ "$DOCS_VERSION" = unstable ]] && \
          DERIVATION=docs-unstable && \
          OUT_PATH=/unstable

        # This is used by the yarn build to determine the version to write up
        # the top, and otherwise determine if it's the unstable version or
        # not. yarn.env is a tracked input to the Nix derivation.
        echo "export DOCS_VERSION=$DOCS_VERSION" > docs/yarn.env

        # transaction-cost is generated by the docs build itself (see
        # nix/hydra/docs.nix preBuild), so it is not generated here.
        nix build .#${DERIVATION}

        export out=/tmp/public/head-protocol${OUT_PATH}
        mkdir -p $out
        cp result/build/* $out -r

        # Confirm the built site's visible version before writing its provenance.
        # This markup is set explicitly in docs/docusaurus.config.js.
        if ! grep -Fq "<span class=\"navbar-version\">$DOCS_VERSION</span>" "$out/index.html"; then
          echo "::error::Built docs do not display version $DOCS_VERSION"
          exit 1
        fi
        jq -n --arg version "$DOCS_VERSION" --arg commit "$SOURCE_SHA" \
          '{version: $version, commit: $commit}' > "$out/deployment.json"

        sudo chmod -R 777 /tmp/public

        # The end-to-end pages measure hardware-specific throughput, so they stay
        # generated on CI and published as-is (linked, not local pages). The
        # ledger micro-benchmark is a self-contained criterion HTML report.
        nix develop .#hydra-node-bench --command -- micro -o $out/benchmarks/ledger-bench.html
        nix develop .#hydra-cluster-bench --command -- \
          bench-e2e \
          single \
          hydra-cluster/datasets/1-node.json \
          hydra-cluster/datasets/3-nodes.json \
          hydra-cluster/datasets/1-node-1kutxo.json \
          --timeout 1800s \
          --output-directory $out/benchmarks
        # Same fixed seed as the ci-nix matrix job so both pipelines measure
        # identical workloads (cell i uses seed+i).
        nix develop .#hydra-cluster-bench --command -- \
          bench-e2e \
          matrix \
          --output-directory $out/benchmarks \
          --number-of-txs 30 \
          --timeout 3600s \
          --incremental-modes False \
          --seed 2755

    - name: 👉 Create redirects
      run: |

        function redirect() {
          echo "Creating redirect: $1 -> $2"
          mkdir -p $(dirname $1)
          echo "<!DOCTYPE html><html><head><meta http-equiv=\"Refresh\" content=\"0; URL=${2}\"></head></html>" > $1
        }
        echo "hydra.family" > /tmp/public/CNAME
        touch /tmp/public/.nojekyll

        redirect /tmp/public/index.html https://hydra.family/head-protocol

        # Monthly reports moved to scaling website (2024-02-29)

        rm -rf /tmp/public/head-protocol/monthly

        # Note: This runs for either docs target, but it doesn't matter as
        # it doesn't hurt to write these files twice.

        redirect /tmp/public/head-protocol/monthly/index.html https://cardano-scaling.github.io/website/monthly
        redirect /tmp/public/head-protocol/unstable/monthly/index.html https://cardano-scaling.github.io/website/monthly

    - name: 🧹 Strip benchmark working state
      run: |

        # Safety net: node working state must never be published. The deploy uses
        # clean:false, so anything uploaded here lingers on gh-pages forever and
        # once grew it past the 10GB Pages limit, breaking every deployment.
        find /tmp/public -type d \( -name etcd -o -name db -o -name logs \) -prune -exec rm -rf {} +

    - name: Upload documentation for deployment
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: /tmp/public
        include-hidden-files: true
        if-no-files-found: error
        overwrite: true
        retention-days: 7

  deploy:
    name: Deploy and Verify Documentation
    needs: [source, build]
    runs-on: ubuntu-latest
    # Both targets write to gh-pages. Queue every deployment, including stable
    # releases, instead of replacing an existing pending job with a newer one.
    concurrency:
      group: publish-docs-deploy
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      DOCS_VERSION: ${{ needs.source.outputs.version }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ env.SOURCE_SHA }}

    - name: Download built documentation
      uses: actions/download-artifact@v4
      with:
        name: documentation
        path: /tmp/public

    - name: Check this version is still current
      id: current
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        # A newer release or commit may have arrived during the build.
        if [[ "$DOCS_VERSION" == unstable ]]; then
          current=$(gh api "repos/$GH_REPO/commits/master" --jq .sha)
          expected=$SOURCE_SHA
        else
          current=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          expected=$DOCS_VERSION
        fi
        if [[ "$current" == "$expected" ]]; then
          echo "publish=true" >> "$GITHUB_OUTPUT"
        else
          echo "Skipping superseded docs for $DOCS_VERSION ($SOURCE_SHA)." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: 🚢 Publish Documentation
      if: steps.current.outputs.publish == 'true'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN || github.token }}
        folder: /tmp/public
        force: false
        # Note: This is crucial! We _never_ remove files that we have
        # previously uploaded. This might be surprising if we expect something
        # we previously uploaded to be _removed_!
        clean: false

    - name: Verify deployed version and commit
      if: steps.current.outputs.publish == 'true'
      timeout-minutes: 10
      run: |
        base=https://hydra.family/head-protocol
        if [[ "$DOCS_VERSION" == unstable ]]; then
          base=$base/unstable
        fi
        for attempt in {1..30}; do
          url="$base/deployment.json?run=$GITHUB_RUN_ID-$attempt"
          if actual=$(curl --fail --silent --show-error --max-time 10 \
              --header 'Cache-Control: no-cache' "$url") && \
              jq -e --arg version "$DOCS_VERSION" --arg commit "$SOURCE_SHA" \
                '.version == $version and .commit == $commit' <<< "$actual" >/dev/null; then
            printf 'Published and verified [%s](%s/docs) from `%s`.\n' \
              "$DOCS_VERSION" "$base" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Waiting for $base to report $DOCS_VERSION ($SOURCE_SHA)."
          sleep 10
        done
        echo "::error::Deployment at $base did not report $DOCS_VERSION ($SOURCE_SHA)"
        exit 1
