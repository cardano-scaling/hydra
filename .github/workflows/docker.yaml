# This workflow builds docker images on 'master' and for all release tags.
#
# A release is also tagged 'latest' when it is the highest release tag in the
# repository, so a hotfix on an older line does not take ':latest' backwards.
# Referring to the versioned images is still suggested.
#
# hydra-node is additionally built for aarch64-linux, on an arm runner of its
# own: the x86_64 images come from the musl cross build and there is no
# equivalent for aarch64-linux yet (cardano-scaling/hydra#2370). A last job
# combines the two into a manifest list under the tags clients pull, which is
# what makes 'docker pull' serve an arm64 host its native image.
#
# Adding an architecture must not be able to break what already shipped, so the
# amd64 legs publish their tags themselves, exactly as they did before this
# workflow knew about architectures. The arm64 leg publishes only a scratch tag
# naming the run, and the last job folds it in afterwards. If it never lands,
# that job fails on the missing tag and hydra-node stays amd64-only.
name: Docker

concurrency:
  # This workflow has no pull_request trigger, so this only ever groups master
  # pushes, release tags and manual dispatches. Never cancel a release: the
  # manifest job is what turns hydra-node's tags into an index, and a cancelled
  # run leaves them amd64-only.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

on:
  push:
    branches: [ "master" ]
    tags: [ "*.*.*" ]
  workflow_dispatch:
    inputs:
      ref_name:
        type: string
        description: 'Point-in-time to build the custom docker images'
        required: true
        default: "master"

permissions:
  packages: write

jobs:
  # Computed once and shared, so that the per-architecture builds and the
  # manifest list combining them cannot disagree about what to call the image.
  tags:
    runs-on: ubuntu-latest

    # Only reads git; does not publish anything.
    permissions: {}

    outputs:
      version: ${{ steps.compute.outputs.version }}
      tags: ${{ steps.compute.outputs.tags }}

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.ref_name || '' }}
        # All history, as the 'latest' decision below compares this tag
        # against every other release tag. Tags themselves come from the
        # force-fetch in that step, as in binaries.yaml.
        fetch-depth: 0

    - name: 🏷️ Compute tags
      id: compute
      env:
        # Ref names go through the environment rather than workflow expression
        # interpolation, so that one containing shell metacharacters cannot
        # inject into this script.
        DISPATCH_REF: ${{ github.event.inputs.ref_name }}
      run: |

        # Compute tags. We want the following behaviour:
        #
        # 1. Building on tag:
        #
        #    a. Image tagged `<tag>`
        #
        #    b. If the tag is the "latest" one for the present major release,
        #    then also tag it as "latest"
        #
        # 3. Building on master:   image tagged `unstable`.

        # Let's default to 'unstable'.
        IMAGE_LABEL=unstable
        # And the version as the git commit.
        VERSION=${GITHUB_SHA}

        # Determine whether we are building a tag and if yes, set the label
        # name to be the tag name, and the version to be the tag.
        BUILDING_TAG=${{github.ref_type == 'tag'}}
        [[ "${BUILDING_TAG}" = true ]] && \
          IMAGE_LABEL=${GITHUB_REF_NAME} && \
          VERSION=${GITHUB_REF_NAME}

        # The extra tag a manual dispatch gets. Docker tags are
        # [A-Za-z0-9_][A-Za-z0-9._-]{0,127} and our branch names routinely
        # contain '/', which docker rejects outright. The 'workflow_dispatch-'
        # prefix covers the leading-character rule.
        DISPATCH_TAG=
        if [[ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]]; then
          DISPATCH_TAG=workflow_dispatch-${DISPATCH_REF//[^A-Za-z0-9_.-]/-}
          DISPATCH_TAG=${DISPATCH_TAG:0:128}
        fi

        # Every tag this build publishes, the plain label first. Computed once
        # here so that the amd64 build and the manifest replacing hydra-node's
        # tags cannot disagree about what to call the image.
        IMAGE_TAGS=( "${IMAGE_LABEL}" )
        [[ -n "${DISPATCH_TAG}" ]] && \
          IMAGE_TAGS+=( "${DISPATCH_TAG}" )

        # Add 'latest' when this is the highest release tag.
        if [[ "${BUILDING_TAG}" = true ]]; then
          # NOTE: As in binaries.yaml, the tags fetched by checkout are not
          # effective and have to be refetched with --force.
          git fetch --tags --force

          # Build a sorted list of tags . We have to grep-exclude some tags
          # that we don't want to include; i.e. ones that don't point to our
          # actual releases. The '|| true' keeps an empty match from aborting
          # the step under 'bash -e'; emptiness itself is caught right below.
          git tag -l | grep -P '^\d+\.\d+\.\d+$' >tags.txt || true

          # We are building a release tag, so at minimum that tag has to be in
          # the list. An empty one means the fetch did not take, and answering
          # 'not latest' would leave ':latest' on the previous release with a
          # green check.
          if [[ ! -s tags.txt ]]; then
            echo "::error::no release tags found, cannot decide whether ${GITHUB_REF_NAME} is latest"
            exit 1
          fi

          # Get the largest one (sort -V sorts as versions).
          sort -V tags.txt | tail -n1 >latest.txt

          # Compare it to mine; and if it's the same, then I am the latest, so
          # we can tag it as such.
          echo "${GITHUB_REF_NAME}" >mine.txt

          # Note: This will also print the diff if it fails, which is useful
          # for debugging.
          if (diff mine.txt latest.txt); then
            IMAGE_TAGS+=( latest )
          fi
        fi

        echo "version=${VERSION}" >>$GITHUB_OUTPUT
        echo "tags=${IMAGE_TAGS[*]}" >>$GITHUB_OUTPUT

  docker:
    needs: tags

    strategy:
      # The arm64 leg failing must not cancel the amd64 ones, as those publish
      # the tags clients pull.
      fail-fast: false
      matrix:
        include:
        - { target: hydra-node, runner: ubuntu-latest, arch: amd64 }
        - { target: hydra-tui, runner: ubuntu-latest, arch: amd64 }
        - { target: hydraw, runner: ubuntu-latest, arch: amd64 }
        - { target: hydra-chain-observer, runner: ubuntu-latest, arch: amd64 }
        # Only hydra-node has an image on aarch64-linux, see nix/hydra/docker.nix.
        - { target: hydra-node, runner: ubuntu-24.04-arm, arch: arm64 }

    runs-on: ${{ matrix.runner }}
    # Expected to be a download rather than a build, as ci.iog.io populates
    # cache.iog.io for both systems, though nothing orders that against this
    # workflow. amd64 keeps the six hour default; the arm leg is bounded
    # tighter, as a miss there compiles hydra-node on a four-core runner.
    timeout-minutes: ${{ matrix.arch == 'arm64' && 120 || 360 }}
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.ref_name || '' }}

    - name: 🐳 Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: ❄ Setup Nix/Cachix
      uses: ./.github/actions/nix-cachix-setup
      with:
        authToken: '${{ secrets.CACHIX_CARDANO_SCALING_AUTH_TOKEN }}'

    - name: 🔨 🏷️ Build and tag image
      env:
        VERSION: ${{ needs.tags.outputs.version }}
        TAGS: ${{ needs.tags.outputs.tags }}
      run: |

        IMAGE_NAME=ghcr.io/${{github.repository_owner}}/${{matrix.target}}
        echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
        nix build .#docker-${{ matrix.target }}
        docker load < result

        read -ra IMAGE_TAGS <<< "${TAGS}"

        # A tag naming this run rather than the release, so the manifest job
        # combines what this run built and not whatever ':unstable' points at
        # by the time it gets there. Not scoped to the attempt, so re-running
        # one failed leg still finds what the other pushed.
        SCRATCH="${IMAGE_NAME}:build-${GITHUB_RUN_ID}-${{matrix.arch}}"

        # Use 'FROM' instruction to use docker build with --label, as
        # well as setting the tag directly.
        echo "FROM ${{matrix.target}}" | docker build \
          --label org.opencontainers.image.source=https://github.com/cardano-scaling/hydra \
          --label org.opencontainers.image.licenses=Apache-2.0 \
          --label org.opencontainers.image.created=$(date -Is) \
          --label org.opencontainers.image.revision=${GITHUB_SHA} \
          --label "org.opencontainers.image.version=${VERSION}" \
          --tag "${SCRATCH}" -

        # amd64 also carries the tags clients pull, exactly as it did before
        # this workflow knew about architectures. arm64 carries none of them:
        # it is an addition to hydra-node, and a plain tag holding an
        # arm64-only image would make every amd64 client fail the pull.
        if [[ "${{matrix.arch}}" = amd64 ]]; then
          for tag in "${IMAGE_TAGS[@]}"; do
            docker tag "${SCRATCH}" "${IMAGE_NAME}:${tag}"
          done
        fi

        docker inspect "${SCRATCH}"
        docker images

        # hydra-node is the only target the manifest job combines, so it is the
        # only one whose scratch tag has any business reaching the registry.
        [[ "${{matrix.target}}" = hydra-node ]] || \
          docker rmi "${SCRATCH}"

    - name: 📤 Push to registry
      run: |
        docker push -a "${IMAGE_NAME}"

  # Turn hydra-node's tags into a manifest list, so that pulling one on an arm64
  # host serves the native image rather than the amd64 one. It is the only
  # target built for more than one architecture; the rest published their tags
  # from the build job and are already done.
  manifest:
    needs: [ tags, docker ]

    # Run even when a build leg failed. The amd64 images have published their
    # own tags already, and this only upgrades hydra-node's: if the arm64 leg
    # did not land, 'imagetools create' fails on the missing scratch tag and
    # hydra-node stays amd64-only, which is what it was before.
    if: ${{ !cancelled() && needs.tags.result == 'success' }}

    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: 🐳 Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🧩 Combine the per-architecture images
      env:
        TAGS: ${{ needs.tags.outputs.tags }}
      run: |

        IMAGE_NAME=ghcr.io/${{github.repository_owner}}/hydra-node
        BUILD=${IMAGE_NAME}:build-${GITHUB_RUN_ID}

        # The same tags the amd64 leg already published, replaced by an index
        # over both architectures.
        read -ra IMAGE_TAGS <<< "${TAGS}"
        ARGS=()
        for tag in "${IMAGE_TAGS[@]}"; do
          ARGS+=( --tag "${IMAGE_NAME}:${tag}" )
        done

        docker buildx imagetools create "${ARGS[@]}" "${BUILD}-amd64" "${BUILD}-arm64"

        docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAGS[0]}"
