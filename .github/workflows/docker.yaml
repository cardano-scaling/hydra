# This workflow builds docker images on 'master' and for all release tags. The
# 'latest' docker tag on the registry will always point to the latest pushed
# version, likely the one built from 'master', so referring to the versioned
# images is suggested.
#
# Images are built once per architecture, each on a runner of that architecture
# because nix does not cross-build them, and pushed under an arch-suffixed tag.
# A final job combines those into a manifest list under the plain tag, so a
# client pulls the image native to its machine. Only hydra-node is built for
# aarch64-linux; the other targets entrypoint a *-static package, which only the
# x86_64 musl cross build provides.
name: Docker

# Limit concurrent runs of this workflow within a single PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "master" ]
    tags: [ "*.*.*" ]
  workflow_dispatch:
    inputs:
      ref_name:
        type: string
        description: 'Point-in-time to build the custom docker images'
        required: true
        default: "master"

permissions:
  packages: write

jobs:
  # Computed once and shared, so that the per-architecture builds and the
  # manifest list combining them cannot disagree about what to call the image.
  tags:
    runs-on: ubuntu-latest

    outputs:
      label: ${{ steps.compute.outputs.label }}
      version: ${{ steps.compute.outputs.version }}
      latest: ${{ steps.compute.outputs.latest }}

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.ref_name || '' }}

    - name: 🏷️ Compute tags
      id: compute
      run: |

        # Compute tags. We want the following behaviour:
        #
        # 1. Building on tag:
        #
        #    a. Image tagged `<tag>`
        #
        #    b. If the tag is the "latest" one for the present major release,
        #    then also tag it as "latest"
        #
        # 3. Building on master:   image tagged `unstable`.

        # Let's default to 'unstable'.
        IMAGE_LABEL=unstable
        # And the version as the git commit.
        VERSION=${{github.sha}}

        # Determine whether we are building a tag and if yes, set the label
        # name to be the tag name, and the version to be the tag.
        BUILDING_TAG=${{github.ref_type == 'tag'}}
        [[ ${BUILDING_TAG} = true ]] && \
          IMAGE_LABEL=${{github.ref_name}} && \
          VERSION=${{github.ref_name}}

        # If we're running on master, tag it as "unstable" and
        # and leave the version as the git commit.
        [[ ${GITHUB_REF_NAME} = "master" ]] && \
          IMAGE_LABEL=unstable

        # Decide whether this build is also the 'latest' tag.
        LATEST=false
        if [[ ${BUILDING_TAG} = true ]]; then
          # Build a sorted list of tags . We have to grep-exclude some tags
          # that we don't want to include; i.e. ones that don't point to our
          # actual releases.
          git tag -l | grep -P '^\d+.\d+.\d+$' >tags.txt

          # Get the largest one (sort -V sorts as versions).
          sort -V tags.txt | tail -n1 >latest.txt

          # Compare it to mine; and if it's the same, then I am the latest, so
          # we can tag it as such.
          echo ${{ github.ref_name }}>mine.txt

          # Note: This will also print the diff if it fails, which is useful
          # for debugging.
          if (diff mine.txt latest.txt); then
            LATEST=true
          fi
        fi

        echo "label=${IMAGE_LABEL}" >>$GITHUB_OUTPUT
        echo "version=${VERSION}" >>$GITHUB_OUTPUT
        echo "latest=${LATEST}" >>$GITHUB_OUTPUT

  docker:
    needs: tags

    strategy:
      matrix:
        include:
        - { target: hydra-node, runner: ubuntu-latest, arch: amd64 }
        - { target: hydra-tui, runner: ubuntu-latest, arch: amd64 }
        - { target: hydraw, runner: ubuntu-latest, arch: amd64 }
        - { target: hydra-chain-observer, runner: ubuntu-latest, arch: amd64 }
        # Only hydra-node has an image on aarch64-linux, see nix/hydra/docker.nix.
        - { target: hydra-node, runner: ubuntu-24.04-arm, arch: arm64 }

    runs-on: ${{ matrix.runner }}
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.ref_name || '' }}

    - name: 🐳 Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: ❄ Setup Nix/Cachix
      uses: ./.github/actions/nix-cachix-setup
      with:
        authToken: '${{ secrets.CACHIX_CARDANO_SCALING_AUTH_TOKEN }}'

    - name: 🔨 🏷️ Build and tag image
      run: |

        IMAGE_NAME=ghcr.io/${{github.repository_owner}}/${{matrix.target}}
        IMAGE_REF=${IMAGE_NAME}:${{needs.tags.outputs.label}}-${{matrix.arch}}
        echo "IMAGE_REF=${IMAGE_REF}" >> $GITHUB_ENV
        nix build .#docker-${{ matrix.target }}
        docker load < result

        # Use 'FROM' instruction to use docker build with --label, as
        # well as setting the tag directly. The tag carries the architecture;
        # the manifest job below is what publishes the tag clients pull.
        echo "FROM ${{matrix.target}}" | docker build \
          --label org.opencontainers.image.source=https://github.com/cardano-scaling/hydra \
          --label org.opencontainers.image.licenses=Apache-2.0 \
          --label org.opencontainers.image.created=$(date -Is) \
          --label org.opencontainers.image.revision=${{github.sha}} \
          --label org.opencontainers.image.version=${{needs.tags.outputs.version}} \
          --tag ${IMAGE_REF} -

        docker inspect ${IMAGE_REF}
        docker images

    - name: 📤 Push to registry
      run: |
        docker push ${IMAGE_REF}

  # Publish the tags clients actually pull, each a manifest list over whatever
  # architectures the build job produced for that target.
  manifest:
    needs: [ tags, docker ]

    runs-on: ubuntu-latest
    steps:
    - name: 🐳 Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🧩 Combine the per-architecture images
      run: |

        LABEL=${{needs.tags.outputs.label}}

        for TARGET in hydra-node hydra-tui hydraw hydra-chain-observer; do
          IMAGE_NAME=ghcr.io/${{github.repository_owner}}/${TARGET}

          # hydra-node is the only target built for more than one architecture.
          SOURCES=${IMAGE_NAME}:${LABEL}-amd64
          [[ ${TARGET} = hydra-node ]] && \
            SOURCES="${SOURCES} ${IMAGE_NAME}:${LABEL}-arm64"

          docker buildx imagetools create --tag ${IMAGE_NAME}:${LABEL} ${SOURCES}

          # Tag the build as 'latest' if it's the latest tag.
          [[ ${{needs.tags.outputs.latest}} = true ]] && \
            docker buildx imagetools create --tag ${IMAGE_NAME}:latest ${SOURCES}

          # Also tag with ref name when manually dispatched
          [[ ${{github.event_name == 'workflow_dispatch'}} = true ]] && \
            docker buildx imagetools create \
              --tag ${IMAGE_NAME}:workflow_dispatch-${{github.event.inputs.ref_name}} ${SOURCES}

          docker buildx imagetools inspect ${IMAGE_NAME}:${LABEL}
        done
