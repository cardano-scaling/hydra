name: "CI"

# Limit concurrent runs of this workflow within a single PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  # We're using merge-chains; so this needs to run then.
  merge_group:
  push:
    branches:
    - master
    - release
  pull_request:
  # Allows to trigger runs on any branch
  workflow_dispatch:

permissions:
  checks: write
  pull-requests: write

jobs:
  build-test:
    name: "Build & test"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Scale test wait budgets for the slow shared runners; only failure
      # latency is affected, passing waits return as soon as their condition
      # holds. See scaleWaitTime in hydra-cluster's HydraNode module.
      HYDRA_TEST_WAIT_MULTIPLIER: 3
    strategy:
      matrix:
        package:
          - hydra-plutus
          - hydra-plutus-extras
          - hydra-tx
          - hydra-chain-observer
          - hydra-node
          - hydra-cluster
          - hydra-tui
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
        exclude:
          - package: hydra-cluster
            os: ubuntu-24.04-arm
          - package: hydra-tui
            os: ubuntu-24.04-arm
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: ❄ Setup Nix/Cachix
      uses: ./.github/actions/nix-cachix-setup
      with:
        authToken: '${{ secrets.CACHIX_CARDANO_SCALING_AUTH_TOKEN }}'

    # Build the flake check instead of running the suite directly: nix caches
    # the passing *run*, so a package whose sources did not change substitutes
    # from cachix and the suite does not run at all. See nix/hydra/test-checks.nix.
    #
    # -L streams the suite's output into this log while it runs. Without it
    # nix prints nothing until the build ends, so a run that hits the job
    # timeout leaves no trace of which test it was in.
    - name: ❓ Test
      if: ${{ !contains(fromJSON('["hydra-cluster","hydra-tui"]'), matrix.package) }}
      run: |
        sys=$(nix eval --impure --raw --expr builtins.currentSystem)
        mkdir -p ${{ matrix.package }}/test-reports
        out=$(nix build --no-link --keep-failed --print-out-paths -L \
                ".#checks.$sys.test-${{ matrix.package }}")
        cp "$out/junit.xml" ${{ matrix.package }}/test-reports/junit.xml

    # A failed build has no output, so its JUnit report is recovered from the
    # build directory that --keep-failed leaves behind; TMPDIR is that same
    # directory inside the sandbox, so the suite's withTempDir logs land there
    # too (see the Upload logs step). That directory belongs to the nix build
    # user and is unreadable to the runner, so open it up before the uploads.
    # A step of its own rather than a failure branch inside the Test step, so
    # that it also runs when the job timeout kills that step; the upload
    # otherwise dies on EACCES and the run leaves nothing behind.
    - name: 🔓 Recover check output
      if: ${{ always() && !contains(fromJSON('["hydra-cluster","hydra-tui"]'), matrix.package) }}
      run: |
        sudo chmod -R a+rX /tmp/nix-build-*-check* 2>/dev/null || true
        mkdir -p ${{ matrix.package }}/test-reports
        find /tmp -maxdepth 4 -path '*nix-build-*-check*' -name junit.xml \
          -exec cp {} ${{ matrix.package }}/test-reports/junit.xml ';' || true

    # hydra-cluster spawns real cardano-node devnets and hydra-tui needs a tty,
    # so neither has a flake check; they keep running in their dev shell.
    - name: ❓ Test (cluster)
      if: ${{ matrix.package == 'hydra-cluster' }}
      run: |
        cd ${{ matrix.package }} # To ensure the `./golden` files are available.
        mkdir -p test-reports
        nix develop .#${{ matrix.package }}-tests --command tests --xml=test-reports/junit.xml

    # This one is special, as it requires a tty.
    - name: ❓ Test (TUI)
      id: test_tui
      if: ${{ matrix.package == 'hydra-tui' }}
      # https://giters.com/gfx/example-github-actions-with-tty
      # The default shell does not allocate a TTY which breaks some tests
      shell: 'script -q -e -c "bash {0}"'
      env:
        TERM: "xterm"
      run: |
        cd ${{ matrix.package  }}
        mkdir -p test-reports
        nix develop .#${{ matrix.package }}-tests --command tests --xml=test-reports/junit.xml

    - name: 📊 Publish test report & upload JUnit XML
      if: always()
      uses: ./.github/actions/publish-test-report
      with:
        report-path: ${{ matrix.package }}/test-reports/junit.xml
        check-name: tests / ${{ matrix.package }} (${{ matrix.os }})
        artifact-name: junit-${{ matrix.package }}-${{ matrix.os }}

    # NOTE: Failed tests keep their temp dir (see withTempDir), so only
    # failures produce files here. The glob deliberately matches any temp dir
    # with a logs/ subdirectory rather than specific withTempDir templates;
    # template renames silently broke a template-coupled glob before. The
    # artifact name is matrix-keyed because upload-artifact requires unique
    # names within a run.
    - name: 💾 Upload logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-logs-${{ matrix.package }}-${{ matrix.os }}
        path: |
          /tmp/nix-shell.*/*/logs/*
          /tmp/nix-build-*-check*/**/logs/*
        if-no-files-found: ignore

  spec:
    name: "Formal specification"
    runs-on: ubuntu-latest
    # Agda typechecking is the long pole here and a non-terminating definition would otherwise sit
    # until the runner's own limit; `build-test` uses the same bound.
    timeout-minutes: 60
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: ❄ Setup Nix/Cachix
      uses: ./.github/actions/nix-cachix-setup
      with:
        authToken: '${{ secrets.CACHIX_CARDANO_SCALING_AUTH_TOKEN }}'

    # Same derivations as the `spec` / `hydra-agda-generated` flake checks
    # (checks are not resolved by bare `nix build .#name`, hence the full path):
    # Agda-typechecks the literate spec and renders the PDF, then verifies the
    # committed MAlonzo extraction under hydra-agda/generated is not stale.
    - name: 📖 Build specification & check Agda extraction
      run: |
        nix build --out-link result-spec \
          .#checks.x86_64-linux.spec
        nix build --no-link \
          .#checks.x86_64-linux.hydra-agda-generated

    # The rendered PDF is the artefact a specification review actually wants to read, and the job
    # has just built it either way.
    - name: 📎 Upload the rendered specification
      uses: actions/upload-artifact@v7
      with:
        name: hydra-spec
        path: result-spec/hydra-spec.pdf
        if-no-files-found: error

  benchmarks:
    name: "Benchmarks"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: hydra-node
            bench: tx-cost
            tag: tx-cost
            options: '--output-directory $(pwd)/../benchmarks'
          - package: hydra-node
            bench: micro
            tag: micro
            options: '-o $(pwd)/../benchmarks/ledger-bench.html'
          - package: hydra-cluster
            bench: bench-e2e
            tag: e2e
            options: 'single datasets/1-node.json datasets/3-nodes.json --output-directory $(pwd)/../benchmarks --timeout 1000s'
          - package: hydra-cluster
            bench: bench-e2e
            tag: matrix
            # Skip the incremental-ops dimension in CI: per-cycle ~90s adds up
            # across cells and the cost is known/bounded. Local runs can still
            # opt in via `--incremental-modes False,True`.
            # Fixed seed (cell i uses seed+i) so the matrix benchmarks the
            # same workloads on every run and pages are comparable over time.
            options: 'matrix --output-directory $(pwd)/../benchmarks --number-of-txs 30 --timeout 3600s --incremental-modes False --seed 2755'
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: ❄ Setup Nix/Cachix
      uses: ./.github/actions/nix-cachix-setup
      with:
        authToken: '${{ secrets.CACHIX_CARDANO_SCALING_AUTH_TOKEN }}'

    - name: 📈 Benchmark
      run: |
        mkdir -p benchmarks
        cd ${{ matrix.package }}
        nix build .#${{ matrix.package }}-bench
        nix develop .#${{ matrix.package }}-bench --command ${{ matrix.bench }} ${{ matrix.options }}

    - name: 💾 Upload build & test artifacts
      uses: actions/upload-artifact@v7
      with:
        name: benchmarks-${{matrix.package}}-${{matrix.tag}}
        path: benchmarks

    # NOTE: This depends on the path used in hydra-cluster bench
    - name: 💾 Upload logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: hydra-cluster-bench-logs
        path: /tmp/nix-shell.*/bench-*/**/*.log
        if-no-files-found: ignore

  publish-benchmark-results:
    name: Publish benchmark results
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # TODO: this is actually only requires the tx-cost benchmark results
    needs: [benchmarks]
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Download generated documentation
      uses: actions/download-artifact@v8
      with:
        path: artifact
        pattern: benchmarks-*
        merge-multiple: true

    - name: ⚙ Prepare comment body
      id: comment-body
      run: |
        # Drop first 5 header lines and demote headlines one level. Every
        # benchmark output lands in one PR comment, each report inside its own
        # collapsed <details> section so the comment stays short to scroll.
        # The blank line after <summary> is required for the markdown inside
        # to render.
        section() {
          echo "<details>"
          echo "<summary><b>$1</b></summary>"
          echo ""
          sed '1,5d;s/^#/##/' "$2" | grep -v '^:::'
          echo ""
          echo "</details>"
          echo ""
        }
        {
          section "Transaction costs" artifact/transaction-cost.md
          section "End-to-end benchmark results" artifact/end-to-end-benchmarks.md
          section "Scenario benchmark results" artifact/scenarios.md
        } > comment-body.md

    - name: 🔎 Find Comment
      uses: peter-evans/find-comment@v3
      id: find-comment
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: Transaction costs

    - name: ✏ Create or update comment
      uses: peter-evans/create-or-update-comment@v4
      with:
        comment-id: ${{ steps.find-comment.outputs.comment-id }}
        edit-mode: replace
        issue-number: ${{ github.event.pull_request.number }}
        body-file: comment-body.md
