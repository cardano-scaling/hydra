name: "Nightly CI"

# Limit concurrent runs of this workflow within a single PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  schedule:
    # Everyday at 4:00 AM
    - cron: "0 4 * * *"
  # Allows to trigger runs on any branch
  workflow_dispatch:

permissions:
  checks: write
  pull-requests: write

jobs:
  build-test:
    name: "Nightly Blockfrost e2e tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: hydra-cluster
    env:
      HYDRA_BACKEND: blockfrost
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ❄ Setup Nix/Cachix
      uses: ./.github/actions/nix-cachix-setup
      with:
        authToken: '${{ secrets.CACHIX_CARDANO_SCALING_AUTH_TOKEN }}'

    - name: ❓ E2E Blockfrost Test
      id: blockfrost-tests
      run: |
        if [[ "${{secrets.blockfrost_token}}" != '' ]]; then
          cd ${{ matrix.package }}
          echo "${{secrets.blockfrost_token}}" > blockfrost-project.txt
          mkdir -p test-reports
          echo "ran=true" >> "$GITHUB_OUTPUT"
          nix develop .#${{ matrix.package }}-tests --command tests -p "/@requiresBlockfrost/" --xml=test-reports/junit.xml
        else
          echo "ran=false" >> "$GITHUB_OUTPUT"
          echo "::warning file=blockfrost-project.txt,title=BLOCKFROST::Missing blockfrost project file."
        fi

    # Only publish (and enforce require-tests) when we actually ran the suite;
    # a missing Blockfrost token is a tolerated skip, not a failure.
    - name: 📊 Publish test report & upload JUnit XML
      if: always() && steps.blockfrost-tests.outputs.ran == 'true'
      uses: ./.github/actions/publish-test-report
      with:
        report-path: ${{ matrix.package }}/test-reports/junit.xml
        check-name: nightly blockfrost / ${{ matrix.package }}
        artifact-name: junit-nightly-blockfrost-${{ matrix.package }}
        # An empty selection means the @requiresBlockfrost filter matched
        # nothing (e.g. the tag was dropped).
        require-tests: 'true'


  other-nightly-tests:
    name: "Nightly tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: hydra-node
          - package: hydra-tx
          - package: hydra-chain-observer
          - package: hydra-plutus
          # Note: Missing hydra-tui
    env:
      CI_NIGHTLY: True
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ❄ Setup Nix/Cachix
      uses: ./.github/actions/nix-cachix-setup
      with:
        authToken: '${{ secrets.CACHIX_CARDANO_SCALING_AUTH_TOKEN }}'

    - name: Run tests
      run: |
        cd ${{ matrix.package }}
        mkdir -p test-reports
        nix develop .#${{ matrix.package }}-tests --command tests -p "/@nightly/" --xml=test-reports/junit.xml

    - name: 📊 Publish test report & upload JUnit XML
      if: always()
      uses: ./.github/actions/publish-test-report
      with:
        report-path: ${{ matrix.package }}/test-reports/junit.xml
        check-name: nightly / ${{ matrix.package }}
        artifact-name: junit-nightly-${{ matrix.package }}
        require-tests: 'true'
