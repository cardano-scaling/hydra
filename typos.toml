[default.extend-words]
# Typst file extension (.typ / .lagda.typ), referenced throughout the spec.
"typ" = "typ"
# [F]anout
"anout" = "anout"
# [I]ncrement
"ncrement" = "ncrement"
# [C]ommit
"ommit" = "ommit"
# Cardano.Ledger.Compactible module name
"Compactible" = "Compactible"
# 2[nd] ordinal suffix macro in spec/src/macros.tex
"nd" = "nd"
# GHC.Type[Lits] module name
"Lits" = "Lits"

[default]
# Git commit hashes in docs get tokenized into letter runs (e.g. "ba" in
# "32ba5d4a3"); ignore hex-looking identifiers.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

[default.extend-identifiers]
# `sigDed` = the signature-dedup invariant in Security.lagda.typ (camelCase tokenizes
# to "Ded", which typos would otherwise "correct" to "Dead").
"sigDed" = "sigDed"
# `ANDed` = logically AND-ed / conjoined, in a ReferenceBridge.agda comment (splits to
# "AN" + "Ded", same "Ded" -> "Dead" false positive as sigDed).
"ANDed" = "ANDed"
