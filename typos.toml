[default.extend-words]
# [F]anout
"anout" = "anout"
# [I]ncrement
"ncrement" = "ncrement"
# [C]ommit
"ommit" = "ommit"
# Cardano.Ledger.Compactible module name
"Compactible" = "Compactible"
# 2[nd] ordinal suffix macro in spec/src/macros.tex
"nd" = "nd"
# GHC.Type[Lits] module name
"Lits" = "Lits"

[default]
# Git commit hashes in docs get tokenized into letter runs (e.g. "ba" in
# "32ba5d4a3"); ignore hex-looking identifiers.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]
